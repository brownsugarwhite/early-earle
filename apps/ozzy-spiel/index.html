<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Gassirunde</title>
    <link rel="icon" href="data:," />
    <style>
      /* Papier und Tinte aus „liquid drop“ */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #1f1a17;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #flaeche {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #titel {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: max(20px, env(safe-area-inset-left));
        margin: 0;
        font: 400 30px/1 'Lobster', Georgia, serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="flaeche"></canvas>
    <h1 id="titel">Gassirunde</h1>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
