    <circle cx="103" cy="99" r="7" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.2"/>
    <text class="t3" x="103" y="102.5" text-anchor="middle" style="font-size: 9px">1</text>
    <circle cx="103" cy="247" r="7" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.2"/>
    <text class="t3" x="103" y="250.5" text-anchor="middle" style="font-size: 9px">1</text>
    <use href="#pfeil" transform="translate(212,190)"/>
    <ellipse cx="311" cy="312" rx="58" ry="6" fill="#e4dfd6"/>
    <ellipse cx="311" cy="228" rx="40" ry="58" fill="#f3c9a0"/>
    <path d="M 285 152 C 300 146, 322 146, 337 152 C 350 200, 368 260, 378 302 C 352 310, 332 302, 311 308 C 290 302, 270 310, 244 302 C 254 260, 272 200, 285 152 Z" fill="#c95f5f"/>
    <path d="M 300 168 C 296 220, 290 262, 284 304 M 322 168 C 326 220, 332 262, 338 304 M 311 172 C 311 230, 311 270, 311 306" fill="none" stroke="#a64848" stroke-width="1.4"/>
    <path d="M 288 150 C 300 160, 322 160, 334 150 C 328 142, 294 142, 288 150 Z" fill="#a64848"/>
    <circle cx="311" cy="122" r="26" fill="#f3c9a0" stroke="#1b1b1b" stroke-width="1.5"/>
    <circle cx="302" cy="120" r="2.6" fill="#1b1b1b"/>
    <circle cx="320" cy="120" r="2.6" fill="#1b1b1b"/>
    <text class="t4" x="109" y="322" text-anchor="middle">Schnittmuster mit Naht (Studio)</text>
    <text class="t4" x="311" y="336" text-anchor="middle">fällt nach dem Werkstoff</text>
    <text class="t1" x="18" y="440">Stoff aus Schnittmuster</text>
    <text class="t2" x="18" y="464">Teile in 2D zeichnen, Kanten zu Nähten verbinden, auf die</text>
    <text class="t2" x="18" y="482">Figur legen. Oder einfach den Umriss eines Kleides auf die</text>
    <text class="t2" x="18" y="500">Figur zeichnen: Die Schnittmuster entstehen dann von selbst.</text>
  </g>

  <!-- 4 Der Werkstoff bestimmt die Physik -->
  <g transform="translate(40,760)">
    <rect class="tile" width="420" height="590" rx="16"/>
