  <rect width="1390" height="1390" fill="#faf8f4"/>
  <text x="40" y="70" style="font: italic 44px Lobster, Georgia, serif; fill: #1b1b1b">Haare, Stoffe und Physik</text>
  <text x="40" y="106" class="sub">Leitsträhnen als Linien, Schnittmuster mit Nähten, Physik aus dem Werkstoff · Vorschlag vom 23.11.2026 · nichts davon ist gebaut</text>

