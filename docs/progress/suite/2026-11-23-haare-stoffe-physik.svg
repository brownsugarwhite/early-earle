    <path class="ghost" style="stroke-width: 1.4" d="M 344 242 C 362 224, 380 226, 392 238"/>
    <text class="t3" x="350" y="282" text-anchor="middle">anstupsen, werfen</text>
    <path class="grau" d="M 196 356 L 300 356"/>
    <g fill="#1b1b1b"><circle cx="206" cy="356" r="2.5"/><circle cx="222" cy="356" r="2.5"/><circle cx="240" cy="356" r="2.5"/><circle cx="260" cy="356" r="2.5"/><circle cx="282" cy="356" r="2.5"/></g>
    <text class="t3" x="186" y="360" text-anchor="end">◀◀ Rückspulen</text>
    <text class="t1" x="18" y="440">Das iPhone als Spielzeug</text>
    <text class="t2" x="18" y="464">Kippen, und die Schwerkraft folgt. Schütteln, pusten ins</text>
    <text class="t2" x="18" y="482">Mikrofon für Wind, anstupsen, werfen. Rückspulen macht alles</text>
    <text class="t2" x="18" y="500">gefahrlos; Einfrieren macht aus dem Moment eine neue Form.</text>
  </g>

