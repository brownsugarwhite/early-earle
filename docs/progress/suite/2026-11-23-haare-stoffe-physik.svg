    <circle cx="282" cy="124" r="3.5" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
    <g fill="#1b1b1b">
      <circle cx="160" cy="176" r="3.5"/><circle cx="96" cy="230" r="3.5"/>
      <circle cx="186" cy="168" r="3.5"/><circle cx="112" cy="170" r="3.5"/>
      <circle cx="214" cy="168" r="3.5"/><circle cx="290" cy="172" r="3.5"/>
