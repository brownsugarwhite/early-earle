    <g fill="#c9c4bb"><circle cx="304" cy="294" r="3"/><circle cx="376" cy="292" r="3.5"/><circle cx="296" cy="286" r="2"/><circle cx="384" cy="284" r="2"/></g>
    <text class="t3" x="70" y="324" text-anchor="middle">Seifenhaut</text>
    <text class="t4" x="70" y="338" text-anchor="middle">wabbelt, platzt</text>
    <text class="t3" x="160" y="324" text-anchor="middle">Knete</text>
    <text class="t4" x="160" y="338" text-anchor="middle">bleibt verbeult</text>
    <text class="t3" x="250" y="324" text-anchor="middle">Gummi</text>
    <text class="t4" x="250" y="338" text-anchor="middle">springt</text>
    <text class="t3" x="340" y="324" text-anchor="middle">Stein</text>
    <text class="t4" x="340" y="338" text-anchor="middle">kracht</text>
    <text class="t1" x="18" y="440">Der Werkstoff bestimmt die Physik</text>
    <text class="t2" x="18" y="464">Seifenhaut wabbelt und platzt, Knete bleibt verbeult, Gummi</text>
    <text class="t2" x="18" y="482">springt, Stein kracht. Wer einen Werkstoff wählt, wählt auch</text>
    <text class="t2" x="18" y="500">sein Verhalten; die Regler sind für Feinheiten da.</text>
  </g>

  <!-- 5 Das iPhone als Spielzeug -->
  <g transform="translate(485,760)">
    <rect class="tile" width="420" height="590" rx="16"/>
    <g transform="rotate(-10 210 200)">
