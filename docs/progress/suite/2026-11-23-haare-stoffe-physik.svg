    <text class="t4" x="346" y="94" text-anchor="middle">Locken</text>
    <text class="t4" x="394" y="94" text-anchor="middle">Büschel</text>
    <text class="t4" x="24" y="340">Leitsträhnen mit Punkten und Griffen, dazwischen das dichte Haar</text>
    <text class="t1" x="18" y="440">Haare sind Linien</text>
    <text class="t2" x="18" y="464">Ein paar Leitsträhnen sind Linien mit Punkten und Griffen;</text>
    <text class="t2" x="18" y="482">Ozzy füllt das dichte Haar dazwischen. Kämmen, Scheitel,</text>
    <text class="t2" x="18" y="500">Locken und Büschel sind Pinsel und Regler.</text>
  </g>

