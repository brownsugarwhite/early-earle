    <text class="t4" x="80" y="296" text-anchor="middle">Mac, Kino</text>
    <text class="t3" x="210" y="282" text-anchor="middle">Karten, Schalen</text>
    <text class="t4" x="210" y="296" text-anchor="middle">iPhone, Spiel</text>
    <text class="t3" x="340" y="282" text-anchor="middle">Form</text>
    <text class="t4" x="340" y="296" text-anchor="middle">Illustration</text>
    <text class="t1" x="18" y="440">Eine Wahrheit, drei Bilder</text>
    <text class="t2" x="18" y="464">Dieselben Leitsträhnen zeigen sich je nach Gerät und Stil</text>
    <text class="t2" x="18" y="482">als feine Strähnen, als Karten und Schalen wie dein Fell</text>
    <text class="t2" x="18" y="500">oder als große Formen wie bei Ghibli.</text>
  </g>

  <!-- 3 Stoff aus Schnittmuster -->
  <g transform="translate(930,140)">
    <rect class="tile" width="420" height="590" rx="16"/>
    <rect x="24" y="80" width="170" height="220" rx="8" fill="#f6f3ec" stroke="#e4dfd6"/>
    <path d="M 62 104 C 86 96, 120 96, 144 104 L 176 232 L 36 232 Z" fill="#f4dcdc" stroke="#1b1b1b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 56 252 C 86 244, 120 244, 150 252 C 136 282, 72 282, 56 252 Z" fill="#f4dcdc" stroke="#1b1b1b" stroke-width="1.5"/>
