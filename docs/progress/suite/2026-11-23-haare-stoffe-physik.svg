    <g fill="#1b1b1b">
      <circle cx="60" cy="330" r="2.5"/><circle cx="74" cy="330" r="2.5"/><circle cx="90" cy="330" r="2.5"/><circle cx="108" cy="330" r="2.5"/>
      <circle cx="128" cy="330" r="2.5"/><circle cx="150" cy="330" r="2.5"/><circle cx="174" cy="330" r="2.5"/><circle cx="200" cy="330" r="2.5"/>
      <circle cx="226" cy="330" r="2.5"/><circle cx="250" cy="330" r="2.5"/><circle cx="272" cy="330" r="2.5"/><circle cx="292" cy="330" r="2.5"/>
      <circle cx="310" cy="330" r="2.5"/><circle cx="326" cy="330" r="2.5"/><circle cx="340" cy="330" r="2.5"/><circle cx="352" cy="330" r="2.5"/>
    </g>
    <text class="t4" x="210" y="352" text-anchor="middle">eine Aufnahme wird eine Leiste mit Perlenschnur</text>
    <text class="t1" x="18" y="440">Nachschwingen</text>
    <text class="t2" x="18" y="464">Ohren, Schwanz, Bauch und Haare schwingen von selbst nach,</text>
    <text class="t2" x="18" y="482">mit Reglern für Wackeln und Nachziehen. Eine Aufnahme wird</text>
    <text class="t2" x="18" y="500">eine Leiste, die du von Hand weiterformst.</text>
  </g>
</svg>
