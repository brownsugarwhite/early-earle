<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="1390" viewBox="0 0 1390 1390">
  <defs>
    <style>
      .tile { fill: #ffffff; stroke: #e4dfd6; stroke-width: 1.5; }
      .dev { fill: #ffffff; stroke: #1b1b1b; stroke-width: 3; }
      .scr { fill: #fbfaf7; stroke: #d9d4ca; stroke-width: 1.2; }
      .t1 { font: 600 18px "Helvetica Neue", Arial, sans-serif; fill: #1b1b1b; }
      .t2 { font: 14px "Helvetica Neue", Arial, sans-serif; fill: #5f646b; }
      .t3 { font: 12px "Helvetica Neue", Arial, sans-serif; fill: #8a8f96; }
      .sub { font: 17px "Helvetica Neue", Arial, sans-serif; fill: #5f646b; }
      .ink { fill: none; stroke: #1b1b1b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1b1b1b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .base { fill: #f1efeb; stroke: #a7adb4; stroke-width: 2; }
      .div { stroke: #c9c3b8; stroke-width: 1.2; }
      .finger { fill: #ecdccb; stroke: #b9a48f; stroke-width: 1.5; }
      .drop { fill: #1b1b1b; }
    </style>
  </defs>
  <rect width="1390" height="1390" fill="#faf8f4"/>
  <text x="40" y="70" style="font: italic 44px Lobster, Georgia, serif; fill: #1b1b1b">Ansichten je Gerät</text>
  <text x="40" y="106" class="sub">Raum zum Fühlen, Ansichten zum Messen · Vorschlag vom 23.11.2026 · nichts davon ist gebaut</text>

  <!-- iPhone -->
  <rect class="dev" x="90" y="160" width="260" height="540" rx="40"/>
  <rect class="scr" x="104" y="174" width="232" height="512" rx="30"/>
  <text class="t3" x="124" y="206">Front, eingerastet</text>
  <path class="base" d="M 178 380 C 166 330, 186 300, 198 306 C 210 314, 206 350, 204 376 Z"/>
  <path class="base" d="M 238 376 C 236 350, 232 314, 244 306 C 256 300, 274 330, 262 380 Z"/>
