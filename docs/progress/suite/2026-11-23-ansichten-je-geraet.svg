  <ellipse class="ink" cx="220" cy="440" rx="82" ry="62" style="stroke-width: 2.4"/>
  <path class="thin" style="opacity: 0.55" d="M 140 446 C 170 466, 270 466, 300 446"/>
  <ellipse class="finger" cx="306" cy="560" rx="24" ry="32"/>
  <path class="thin" d="M 305 528 C 305 500, 302 470, 302 448"/>
  <path class="drop" d="M 302 424 C 293 435, 293 445, 302 449 C 311 445, 311 435, 302 424 Z"/>
  <circle cx="146" cy="640" r="22" fill="#ffffff" stroke="#a7adb4" stroke-width="1.8"/>
  <ellipse cx="143" cy="642" rx="11" ry="7" fill="#a7adb4"/>
  <ellipse cx="156" cy="639" rx="5" ry="4" fill="#a7adb4"/>
  <circle cx="200" cy="640" r="22" fill="#ffffff" stroke="#a7adb4" stroke-width="1.8"/>
  <circle cx="200" cy="641" r="9" fill="#a7adb4"/>
  <circle cx="254" cy="640" r="22" fill="#ffffff" stroke="#a7adb4" stroke-width="1.8"/>
  <ellipse cx="254" cy="643" rx="12" ry="8" fill="#a7adb4"/>
  <ellipse cx="250" cy="639" rx="4" ry="2.5" fill="#ffffff"/>
  <text class="t3" x="146" y="678" text-anchor="middle">Seite</text>
  <text class="t3" x="200" y="678" text-anchor="middle">Top</text>
  <text class="t3" x="254" y="678" text-anchor="middle">Raum</text>
  <text class="t1" x="70" y="742">iPhone: eine Ansicht im Vollbild</text>
  <text class="t2" x="70" y="768">Die anderen Ansichten als lebende Tropfen</text>
  <text class="t2" x="70" y="788">am Rand: halten schaut hin, tippen wechselt.</text>
  <text class="t2" x="70" y="812">Der Finger zieht am Tropfen am Faden,</text>
  <text class="t2" x="70" y="832">der Punkt bleibt sichtbar.</text>
  <text class="t2" x="70" y="856">Vier Ansichten nur als Übersicht.</text>

  <!-- iPad -->
  <rect class="dev" x="460" y="250" width="470" height="330" rx="26"/>
  <rect class="scr" x="474" y="264" width="442" height="302" rx="14"/>
  <line class="div" x1="695" y1="264" x2="695" y2="566"/>
  <text class="t3" x="488" y="290">Front</text>
  <text class="t3" x="709" y="290">Raum</text>
  <path class="base" d="M 548 400 C 538 360, 556 336, 566 342 C 576 348, 572 378, 570 396 Z"/>
  <path class="base" d="M 600 396 C 598 378, 594 348, 604 342 C 614 336, 632 360, 622 400 Z"/>
  <ellipse class="base" cx="585" cy="440" rx="70" ry="52"/>
  <ellipse class="ink" cx="585" cy="440" rx="70" ry="52" style="stroke-width: 2.2"/>
  <path class="ink" style="stroke-width: 2.4" d="M 602 398 C 594 356, 602 318, 618 317 C 634 318, 634 366, 624 401"/>
  <g transform="rotate(35 640 288)">
    <rect x="633" y="238" width="14" height="70" rx="3" fill="#f3d36b" stroke="#1b1b1b" stroke-width="1.5"/>
    <path d="M 633 308 L 640 324 L 647 308 Z" fill="#e8c9a0" stroke="#1b1b1b" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <ellipse cx="805" cy="500" rx="70" ry="11" fill="#e4dfd6"/>
  <path class="base" d="M 768 400 C 758 360, 776 336, 786 342 C 796 348, 792 378, 790 396 Z"/>
  <path class="base" d="M 822 396 C 820 378, 816 348, 826 342 C 836 336, 854 360, 844 400 Z"/>
  <ellipse class="base" cx="805" cy="440" rx="78" ry="54"/>
  <ellipse cx="782" cy="420" rx="26" ry="13" fill="#ffffff" opacity="0.85"/>
  <circle class="finger" cx="866" cy="534" r="12"/>
  <circle class="finger" cx="894" cy="516" r="12"/>
  <path class="thin" d="M 846 506 A 36 36 0 0 1 902 486"/>
  <path class="thin" d="M 894 480 L 903 486 L 896 495"/>
  <text class="t1" x="460" y="620">iPad: zwei Felder</text>
  <text class="t2" x="460" y="646">Der Stift zeichnet, die Finger drehen und zoomen.</text>
  <text class="t2" x="460" y="666">Quer gehalten auch Vier Ansichten.</text>

  <!-- Mac -->
  <rect class="dev" x="985" y="250" width="360" height="236" rx="12"/>
  <rect class="scr" x="997" y="262" width="336" height="212" rx="4"/>
  <path d="M 960 490 L 1370 490 L 1352 508 L 978 508 Z" fill="#ffffff" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
  <line class="div" x1="1165" y1="262" x2="1165" y2="474"/>
  <line class="div" x1="997" y1="368" x2="1333" y2="368"/>
  <path class="drop" d="M 1165 358 C 1159 366, 1159 373, 1165 376 C 1171 373, 1171 366, 1165 358 Z"/>
  <text class="t3" x="1005" y="279">Front</text>
  <text class="t3" x="1173" y="279">Seite</text>
  <text class="t3" x="1005" y="385">Raum</text>
  <text class="t3" x="1173" y="385">Top</text>
  <path class="base" d="M 1066 314 C 1060 294, 1070 282, 1076 286 C 1082 290, 1080 306, 1078 312 Z"/>
  <path class="base" d="M 1084 312 C 1082 306, 1080 290, 1086 286 C 1092 282, 1102 294, 1096 314 Z"/>
  <ellipse class="base" cx="1081" cy="332" rx="38" ry="25"/>
  <path class="base" d="M 1236 316 C 1230 294, 1244 284, 1250 290 C 1254 296, 1250 308, 1248 314 Z"/>
  <ellipse class="base" cx="1245" cy="334" rx="44" ry="23"/>
  <ellipse class="base" cx="1290" cy="328" rx="12" ry="9"/>
  <ellipse cx="1081" cy="455" rx="36" ry="5" fill="#e4dfd6"/>
  <path class="base" d="M 1064 412 C 1058 394, 1068 384, 1074 388 C 1080 392, 1078 404, 1076 410 Z"/>
  <path class="base" d="M 1086 410 C 1084 404, 1082 392, 1088 388 C 1094 384, 1104 394, 1098 412 Z"/>
  <ellipse class="base" cx="1081" cy="428" rx="40" ry="26"/>
  <ellipse cx="1068" cy="418" rx="12" ry="6" fill="#ffffff" opacity="0.85"/>
  <ellipse class="base" cx="1245" cy="425" rx="46" ry="26"/>
  <circle class="base" cx="1296" cy="425" r="9"/>
  <ellipse class="base" cx="1230" cy="409" rx="8" ry="5"/>
  <ellipse class="base" cx="1230" cy="441" rx="8" ry="5"/>
  <text class="t1" x="985" y="560">Mac: Vier Ansichten</text>
  <text class="t2" x="985" y="586">Tasten 1, 3, 7, 0; Maße und Bezüge.</text>
  <text class="t2" x="985" y="606">Der genaue Arbeitsplatz.</text>

  <!-- Lebendig und genau -->
  <text class="t1" x="40" y="962" style="font-size: 22px">In Bewegung lebendig, in Ruhe genau</text>
  <text class="t2" x="40" y="988">Werkstoffe: Seifenhaut schwingt nach, Knete gibt nach, Stein bleibt starr und genau (CAD).</text>
  <g transform="translate(40,1010)">
    <rect class="tile" width="410" height="320" rx="18"/>
    <ellipse class="base" cx="200" cy="137" rx="118" ry="66"/>
    <path class="ink" d="M 80 135 C 80 80, 160 62, 230 70 C 300 78, 352 110, 352 140 C 352 172, 300 200, 230 205 C 160 210, 80 190, 80 135 Z"/>
    <circle cx="352" cy="140" r="5" fill="#1b1b1b"/>
    <path class="ink" d="M 364 140 L 392 140 M 382 130 L 393 140 L 382 150"/>
    <text class="t1" x="18" y="280">ziehen</text>
    <text class="t2" x="18" y="303">Die Linie folgt sofort, die Haut kommt nach.</text>
  </g>
  <g transform="translate(490,1010)">
    <rect class="tile" width="410" height="320" rx="18"/>
    <path class="base" d="M 84 135 C 84 76, 166 56, 240 64 C 322 72, 374 108, 374 140 C 374 176, 320 208, 240 214 C 166 218, 84 194, 84 135 Z"/>
    <path class="ink" d="M 80 135 C 80 80, 160 62, 230 70 C 300 78, 352 110, 352 140 C 352 172, 300 200, 230 205 C 160 210, 80 190, 80 135 Z"/>
    <path class="thin" style="stroke: #a7adb4" d="M 384 116 Q 392 140 384 164 M 396 126 Q 402 140 396 154"/>
    <text class="t1" x="18" y="280">schwingt</text>
    <text class="t2" x="18" y="303">Die Haut schwingt nach wie ein Wasserballon.</text>
  </g>
  <g transform="translate(940,1010)">
    <rect class="tile" width="410" height="320" rx="18"/>
    <path class="base" d="M 80 135 C 80 80, 160 62, 230 70 C 300 78, 352 110, 352 140 C 352 172, 300 200, 230 205 C 160 210, 80 190, 80 135 Z"/>
    <path class="ink" d="M 80 135 C 80 80, 160 62, 230 70 C 300 78, 352 110, 352 140 C 352 172, 300 200, 230 205 C 160 210, 80 190, 80 135 Z"/>
    <path class="ink" d="M 338 44 L 350 58 L 374 30"/>
    <text class="t1" x="18" y="280">Ruhe</text>
    <text class="t2" x="18" y="303">Die Haut sitzt genau auf den Linien.</text>
  </g>
