name: web

# CI-Minuten sparen (privates Repo, Free-Plan: 2 000 Minuten im Monat; zwei Sitzungen pushen oft):
# - bei jedem Push/PR nur der schnelle Check (Typen, Unit-Tests, Lint, Build) in einem Job, ~5 min;
#   ein neuerer Push bricht den laufenden Check ab;
# - die volle E2E-Suite (SwiftShader, ~35–40 min) wöchentlich und auf Knopfdruck (Actions → web → Run workflow).
# Vor jedem Merge laufen die E2E-Tests ohnehin lokal auf echter GPU (`E2E_PORT=… node apps/game/scripts/e2e.mjs`).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm --filter @ee/game build
      # Web-Hosting: GitHub Pages ist für private Repos im Free-Plan nicht verfügbar.
      # Bis ein Host feststeht (z. B. Cloudflare Pages), wird der Build nur als Artefakt abgelegt.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: web-dist, path: apps/game/dist, retention-days: 7 }

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/game
      - run: pnpm e2e
        env: { CI: '1', DEBUG: 'pw:webserver' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/game/playwright-report }
