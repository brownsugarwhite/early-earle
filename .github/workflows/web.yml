name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/game
      - run: pnpm e2e
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/game/playwright-report }

  build:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ee/game build
      # Web-Hosting: GitHub Pages ist für private Repos im Free-Plan nicht verfügbar.
      # Bis ein Host feststeht (z. B. Cloudflare Pages), wird der Build nur als Artefakt abgelegt.
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/game/dist, retention-days: 14 }
